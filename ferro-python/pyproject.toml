[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ferro"
# 版本从 Cargo.toml 取。手动同步这条路已被证明失效：这里曾长期停在 0.1.7,
# 而 Cargo.toml 已经走到 0.2.1,maturin 打出的 wheel 会带那个陈旧版本号
dynamic = ["version"]
description = "ferro — 计算化学 MD 轨迹后处理工具（Python 绑定）"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
# `ferro-py plot` / `ferro.plot`; also needs a LaTeX installation (text is set with usetex)
plot = ["matplotlib", "pandas", "scienceplots"]

[project.scripts]
ferro-py = "ferro.cli:main"

[tool.maturin]
module-name = "ferro._ferro"
python-source = "python"
