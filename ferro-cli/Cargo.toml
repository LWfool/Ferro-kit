[package]
name = "ferro"
version.workspace = true
edition.workspace = true

[lib]
name = "ferro"
path = "src/lib.rs"

[[bin]]
name = "ferro"
path = "src/main.rs"

[dependencies]
ferro-core      = { path = "../ferro-core" }
ferro-io        = { path = "../ferro-io" }
ferro-analysis  = { path = "../ferro-analysis" }
ferro-structure = { path = "../ferro-structure" }
ferro-workflow  = { path = "../ferro-workflow" }
clap             = { version = "4.5", features = ["derive"] }
rust_xlsxwriter  = "0.97"
plotters         = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf", "full_palette", "line_series"] }
anyhow.workspace = true
rayon.workspace  = true
glob.workspace   = true
