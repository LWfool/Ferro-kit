[workspace]
members = [
    "ferro-core",
    "ferro-io",
    "ferro-structure",
    "ferro-analysis",
    "ferro-workflow",
    "ferro-cli",
    # "ferro-python",  # 暂时注释掉，等熟悉 Rust 后再启用
]
resolver = "2"

[workspace.package]
version = "0.3.4"
edition = "2021"
authors = ["Wei LIU <whisper256136@gmail.com>"]
license = "MIT"

[workspace.dependencies]
# 线性代数库,用于处理坐标、矩阵计算
nalgebra = "0.35"
# 多维数组,用于大规模数据处理
ndarray = "0.17"
# NumPy .npy 读写（DeePMD 数据集）；0.10 要求 ndarray ^0.17.1，与上面同一份
ndarray-npy = "0.10"
# 并行计算库
rayon = "1.8"
# FFT：时间相关函数（msd）的 O(N log N) 全原点平均
rustfft = "6.4"
# 错误处理
thiserror = "2.0"
anyhow = "1.0"
rand = "0.10"
# 打乱用的随机源。rand 的 StdRng 不承诺跨版本同算法，归档的 seed 要能复现，
# 所以直接用它当前的实现 ChaCha12Rng（ChaCha 是密码算法，输出由规范钉死）
chacha20 = { version = "0.10.1", default-features = false, features = ["rng"] }
# 文件名模式展开（批处理输入索引）
glob = "0.3"

[profile.release]
opt-level = 3        # 默认就是 3，最高优化
lto = true           # 链接时优化，减小体积、提升性能
codegen-units = 1    # 单编译单元，允许更激进的优化（编译变慢）
panic = "abort"      # 去掉 panic 展开代码，减小体积
strip = true         # 自动 strip 调试符号，减小体积
