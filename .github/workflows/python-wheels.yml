# ferro-python 的 wheel：manylinux2014 x86_64（glibc 2.17，CentOS 7 可装）与 macOS arm64。
# abi3-py311：每个平台一个 wheel，Python ≥ 3.11 通用。产物在 Actions 页面的 artifacts 里下载，
# 超算上 `pip install --no-index ferro-*.whl`。
name: python-wheels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ferro-*/**"
      - ".github/workflows/python-wheels.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2014"
          args: --release --out dist -m ferro-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist -m ferro-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  # 用编好的 manylinux wheel 跑 pytest：装的是要发到超算的同一个文件
  test-linux:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: pip install --no-index --find-links dist ferro && pip install pytest
      - run: pytest -q ferro-python/tests
